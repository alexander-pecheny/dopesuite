# What the login bot says on its own.
[texts]
help = "Пришлите мне код со страницы входа, и я вас впущу."
down = "Сайт сейчас не отвечает. Попробуйте через минуту."

[register]
done = "Готово. Вернитесь на страницу, с которой начали: вы вошли."
expired = "Код истёк. Откройте страницу входа ещё раз, там будет новый."

[login]
hint = 'Откройте {{.url}} и нажмите «Войти через телеграм». Страница покажет код, который нужно прислать мне.'

# A channel post forwarded to the bot, for the nomination form to load.
[forward]
saved = 'Сохранил пост {{.link}}. Теперь вставьте эту ссылку в форму номинации и нажмите «Загрузить».'
private = "Это пост из закрытого канала, у него нет ссылки. Вставьте в форму текст вопроса."
empty = "В этом посте нет текста. Вставьте в форму текст вопроса."
