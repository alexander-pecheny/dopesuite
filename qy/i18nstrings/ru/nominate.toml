# The nomination form.
[page]
title = "Номинация вопросов"
closed = 'Номинация вопросов идёт с {{.from}} по {{.to}}.'
lead = 'Можно номинировать до {{.main}} вопросов и {{.reserves}} запасных. Форму можно менять до {{.until}} включительно.'
eligible = 'Подходят вопросы турниров, отыгрыш которых начался с {{.from}} по {{.to}}.'
how_to = "Для каждого вопроса вставьте ссылку на него и нажмите «Загрузить». Загрузить можно вопрос из базы gotquestions или пост из телеграм-канала. Если ссылки нет, вставьте текст вопроса целиком и нажмите «Распарсить». Потом проверьте вопрос во вкладке «Просмотр» и поправьте поля, если что-то распозналось не так. Текст вопроса, ответ, источник и автор обязательны. Для неопубликованного вопроса нужна ещё ссылка на турнир."
# Shown above the form to an admin who opens it outside the nomination stage.
admin_preview = "Номинация ещё не открыта. Вы видите форму, потому что вы админ. Сохранённые сейчас вопросы попадут в конкурс, поэтому после проверки очистите их."
reserves = "Запасные вопросы"
submit = "Сохранить номинацию"
# The form came back unsaved because some slots have mistakes.
not_saved = "Номинация не сохранена. Исправьте отмеченные вопросы и сохраните ещё раз."
files_lost = "Прикреплённые файлы не сохранились, их нужно выбрать заново."

[slot]
main = 'Вопрос {{.n}}'
reserve = 'Запасной вопрос {{.n}}'
# The one box a slot starts with: a link to load, or a whole question to parse.
source = "Ссылка на вопрос или вопрос целиком"
load = "Загрузить"
load_failed = "Не получилось загрузить вопрос по этой ссылке. Вставьте вместо ссылки текст вопроса и нажмите «Распарсить»."
parse = "Распарсить"
parse_failed = "Не нашли в тексте ответ. Проверьте, что в нём есть строка «Ответ:», или заполните поля сами."
tab_preview = "Просмотр"
tab_fields = "Поля"
tab_text = "Текст"
# The preview of a slot whose required fields are still empty.
preview_empty = "Поля пока пустые. Заполните их во вкладке «Поля»."
# The button that shows an empty optional field.
add = '+ {{.field}}'
clear = "Очистить"
move_up = "Поднять выше"
move_down = "Опустить ниже"
# The box and the line under it once the box holds the question as text.
text_label = "Вопрос текстом"
text_hint = "Это тот же вопрос текстом. Правки здесь и во вкладке «Поля» переносятся друг в друга."
link = "Ссылка на публикацию"
link_hint = "Если вопрос опубликован: ссылка на gotquestions, на пост в телеграме или на другую публикацию."
tournament = "Ссылка на турнир"
tournament_hint = "Обязательна, если вопрос не опубликован."
parsed = 'Распознали вопрос с ответом «{{.answer}}».'
link_only = "Сохранили ссылку. Текст вопроса оргкомитет заберёт из базы сам."
file = "Файл для раздатки"
file_hint = "Картинка или другой файл, до 20 МБ. Новый файл заменит прикреплённый."
drop_file = "Убрать прикреплённый файл"

[field]
text = "Текст вопроса"
handout = "Раздаточный материал"
handout_hint = "Текст раздатки или ссылка на картинку. Файл можно прикрепить ниже."
answer = "Ответ"
zachet = "Зачёт"
nezachet = "Незачёт"
comment = "Комментарий"
source = "Источник"
author = "Автор"

[error]
bad_link = "Ссылка на публикацию должна начинаться с https://."
no_tournament = "Укажите ссылку на турнир."
bad_tournament = "Ссылка на турнир должна начинаться с https://."
missing = 'Заполните обязательные поля: {{.fields}}.'
file_too_big = "Файл больше 20 МБ."

# The automatic check of rule 2. It warns and does not refuse: the nominator
# may keep the question and explain why the check is wrong.
[lint]
title = "Автоматическая проверка считает, что этот вопрос нельзя номинировать:"
dates_off = 'Отыгрыш турнира начался {{.date}}. Подходят турниры, отыгрыш которых начался с {{.from}} по {{.to}}.'
still_playable = 'Турнир можно сыграть в зачёт до {{.date}}, то есть и после публикации шорт-листа {{.shortlist}}.'
author_barred = 'Автор вопроса {{.name}} входит в жюри или оргкомитет конкурса.'
editor_barred = 'Редактор турнира {{.name}} входит в жюри или оргкомитет конкурса.'
what_now = "Это пункт 2 регламента. Номинируйте другой вопрос или поправьте ссылку на турнир и поля. Если вы думаете, что проверка ошиблась, напишите почему. Вопрос сохранится, и оргкомитет проверит его вручную."
appeal = "Почему проверка ошиблась"
unchecked = "Не получилось проверить турнир на сайте рейтинга. Его даты и редакторов оргкомитет проверит сам."
