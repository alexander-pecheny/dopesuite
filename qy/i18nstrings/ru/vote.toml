# The first stage, for the jury.
like = "Нравится"

[page]
title = "Голосование жюри"
not_juror = "Эта страница для членов жюри. Если вы в жюри, проверьте, что вошли через тот телеграм, который сообщили оргкомитету."
closed = 'Первый этап и фактчек идут с {{.from}} по {{.to}}.'
nothing_yet = "Вопросы ещё не опубликованы."

[portion]
lead = 'Вопросы выходят порциями, новая открывается раз в {{.days}} {{plural .days "день" "дня" "дней"}}. Отмечайте понравившиеся вопросы, отметки сохраняются сразу. Отметки в прошлых порциях можно менять до конца этапа.'
tabs = "Порции"
title = 'Порция {{.n}}, открыта {{.date}}.'
next = 'Следующая порция откроется {{.date}}.'
empty = "В этой порции для вас вопросов нет."
not_open = "Эта порция ещё не открыта."
opens = 'Откроется {{.date}}'
# A portion whose day has come that the organisers have not checked yet.
preparing = "Скоро откроется"
next_preparing = "Следующая порция откроется, как только оргкомитет её проверит."

# The tab after the last portion: every question the juror liked.
[liked]
tab = "Понравившиеся"
lead = 'Здесь все вопросы, которые вам понравились. Один из них можно выбрать любимым: он получит от вас {{.n}} {{plural .n "очко" "очка" "очков"}}, остальные по одному.'
empty = "Вы пока не отметили ни одного вопроса."
favourite = "Любимый"
no_favourite = "Без любимого"

[factcheck]
lead = 'Это вопросы предварительного шорт-листа, которые вы отметили, вместе с фактчеком. Если после фактчека вопрос вам больше не нравится, снимите отметку до {{.date}} включительно.'
nothing = "Вы не отмечали вопросов, которые попали в предварительный шорт-лист."

# The tie-break round: the questions tied at a cut of the shortlist, which the
# expert jury marks from 1 to 10 during the factcheck.
[tiebreak]
title = "Дополнительный тур"
lead = 'У этих вопросов поровну очков на границе прохода в шорт-лист. Оцените каждый по десятибалльной шкале до {{.date}} включительно. Оценки сохраняются сразу. Бюллетень засчитывается, только когда оценены все вопросы.'
