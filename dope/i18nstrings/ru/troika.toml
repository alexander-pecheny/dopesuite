# The Тройка screen (dope/dope/web/ts/troika.ts): the per-бой protocol sheets
# with their seating columns, the group cross-tables, and the per-player
# statistics (dope/dope/web/ts/troika-stats.ts).

# The page title when neither the fest view nor the scheme names the game.
title = "Тройка"

[team]
# The placeholder name of a side no participant is seated in (Команда 1, Команда 2).
fallback = 'Команда {{.n}}'

[protocol]
# The per-бой sheet: the team column header, and the «рассадка» column's
# header, which stands before every тема a side turned round at.
team = "Команда"
seating = "Рассадка"

[theme]
# A тема block's head: its number and its нарицательная («Тема 2 (за 3)»).
head = 'Тема {{.n}} (за {{.value}})'
# The × button undoing the seating change before the n-th тема.
unseat = 'Убрать смену рассадки перед темой {{.n}}'
# The ⇅ button opening a seating column before the n-th тема.
seat = 'Поменять рассадку с темы {{.n}}'

[chair]
# The seat pickers' tooltips: the lead horse's seat, and the n-th outrider's.
lead = "Коренной"
outrider = 'Пристяжной {{.n}}'

[bout]
# The «Закончен» checkbox in a бой's head row.
finished = "Закончен"

[groups]
# The rating-ball column the group tables put in front of the canon columns.
rating = "Р"

[stats]
# The per-player statistics tab: the column headers.
player = "Игрок"
team = "Команда"
bouts = "Бои"
first = "Взял первым"
repeat = "Повторил"
repeat_rate = "Удачные повторы"
points = "Очки"

[shootout]
# The button in a бой's head that adds a перестрелка тема while the sides are
# level (регламент: one тема, then темы until the first right answer).
add = "Перестрелка"
# The head of the n-th перестрелка тема.
head = 'Перестрелка {{.n}}'
# The × on the last перестрелка тема while nothing is entered in it.
drop = "Убрать тему перестрелки"

[written]
# The written отбор's sheet: the columns after Σ. «3» and «2» count the
# вопросы a troika answered three and two times right, the отбор's tiebreak.
threes = "3"
threes_hint = "Вопросов с тремя правильными ответами"
twos = "2"
twos_hint = "Вопросов с двумя правильными ответами"
place = "Место"

[swiss]
# The Swiss Block's table: its column heads. «Отбор» is the place a troika
# took in the written отбор, the seed that settles a tie in record.
place = "М"
wins = "Победы"
losses = "Поражения"
seed = "Отбор"
