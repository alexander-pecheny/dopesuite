# The roster and seed imports (dope/dope/domain/imports): the seed ladder's
# source resolution and uploaded-sheet parsing, the composing "by players"
# seeding, the rating.chgk.net roster sync, and the one-shot
# `dope import-ek-results` restore CLI. Every error here reaches a person —
# the seed tab, the roster import button or the restore CLI's printout.

[seed_source]
# The seed source's label, as the import's messages name it (the source in
# "<source> содержит команду … больше одного раза"). FromKSI is the ЭК
# page's «Импорт из КСИ» button.
ksi = "КСИ"
# The scheme's seed: random lot.
random = "жребий"
# The scheme's seed: players — the composing seeding from source games.
players = "по игрокам"
# The fest's whole roster in its own order (FromFest).
fest = "список феста"
# The fest's troikas, for a Тройка (FromTroikas).
troikas = "тройки феста"

[seed]
# Importing the seed when the fest has no КСИ game to rank.
ksi_missing = "в фесте нет игры КСИ"
# The game's scheme declares no [init] seed at all.
scheme_missing = "схема игры не объявляет посев ([init] seed)"
# The scheme declares seed: xlsx, which only an uploaded sheet provides.
scheme_xlsx = "посев из xlsx: загрузите файл на вкладке посева"
# parseSeedXLSX: the uploaded seeding sheet (column A team, column B basket).
xlsx_open = 'не удалось открыть xlsx: {{.err}}'
xlsx_no_sheets = "в xlsx нет листов"
# A sheet row naming a team the fest roster does not have; {{.n}} is the
# 1-based sheet row, {{.name}} the cell's text.
xlsx_team_unknown = 'строка {{.n}}: команда "{{.name}}" не найдена в фесте'
# A row's basket column that is not a number.
xlsx_basket_not_number = 'строка {{.n}}: корзина "{{.basket}}" — не число'
xlsx_no_teams = "в xlsx нет команд"
# A team row without a basket on a sheet where other rows carry baskets.
xlsx_basket_missing = 'команда "{{.name}}" без корзины, а лист корзинный (строка {{.n}})'
# importCandidatesTx: the source names one fest team twice; {{.first}} is the
# name it carried the first time.
team_twice = '{{.source}} содержит команду "{{.name}}" больше одного раза (первое имя: "{{.first}}")'
# SetSeedImportDeclined on the seed tab before any import ran, or for a team
# the import does not hold.
nothing_imported = "В списке участников пока никого нет."
team_not_found = "Этого участника нет в списке."
# The by-players seeding picked on a Game whose [init] does not declare it.
players_undeclared = "Посев по игрокам работает, только если схема игры его описывает ([init] seed: players)."
# The troikas source over a division that holds none.
no_troikas = "В фесте нет троек в этом зачёте."
# standingsCandidates and loadSeedSourceGame: the source game lookup.
game_missing = 'в фесте нет игры с кодом {{.code}}'
# A source game with no, or more than one, ranked table to seed from.
no_standings = 'у игры {{.code}} ещё нет таблицы'
multiple_standings = 'у игры {{.code}} {{.n}} {{plural .n "таблиц" "таблиц" "таблиц"}} — посев берётся из игры с одной'
source_no_teams = "в игре-источнике нет команд"
# The [init] sorting naming a metric the source game's table does not carry.
metric_unknown = 'sorting: {{.metric}} — игра {{.code}} такой метрики не считает'
# The random lot over a fest with no numbered teams.
no_numbered_teams = "в фесте нет пронумерованных команд"

[seed_players]
# The fromPlayers source ([init] seed: players): checks on the scheme's
# declarations, before anything is read.
no_games = "посев по игрокам: схема не называет игры-источники"
no_sorting = "посев по игрокам: схема не говорит, чем сортировать ([init] sorting)"
# The [init] sorting naming a metric the seed rules never compute; {{.known}}
# lists the ones they do.
metric_unknown = 'sorting: {{.metric}} не считается — есть {{.known}}'
no_rosters = "посев по игрокам: у команд этой игры нет составов"
# A seed.<metric> rule aggregating a player metric no rule defines; {{.over}}
# is that metric's name.
metric_missing = 'seed.{{.name}}: {{.over}} — такой метрики игрока нет'
# A named rule (player.<name> or seed.<name>) reading itself; {{.grain}} is
# the rules' prefix ("player" or "seed").
self_reference = '{{.grain}}.{{.name}}: правило зависит от самого себя'
# A seed.<metric> rule that is not mean/min/max/sum/count of a metric.
aggregate_expected = 'seed.{{.name}}: жду mean(метрика), min, max, sum или count'
# A source game with more than one ranked table: no single place per team.
multiple_standings = 'у игры {{.code}} несколько таблиц — посев по игрокам берётся из игры с одной'
# A participant whose team shows no players in this game.
no_roster = 'посев по игрокам: у команды {{.name}} нет состава'

[rating]
# The roster import button's request to rating.chgk.net.
fetch_failed = 'не удалось запросить рейтинг: {{.err}}'
# A non-200 answer; {{.detail}} is the body snippet or the HTTP status.
api_error = 'рейтинг вернул ошибку: {{.detail}}'
# An answer that is not the expected JSON.
decode_failed = 'не удалось разобрать ответ рейтинга: {{.err}}'
# A team with more than nine players.
squad_too_big = 'состав "{{.name}}" больше 9 игроков'
# An import run on an empty roster.
no_teams = "рейтинг не вернул команды"
# The import stopped because teams with results would leave the roster. Shown
# only if the host page does not catch the conflict and ask; {{.n}} is how many
# such teams there are.
conflict_error = 'Импорт остановлен: из списка уходят команды, у которых уже есть результаты ({{.n}}).'
# A merge the import cannot honour: the answered form no longer matches the
# roster the site returns.
merge_stale = "Список команд изменился, пока вы отвечали. Запустите импорт ещё раз."

[ek_restore]
# The one-shot `dope import-ek-results` CLI prints the standings after the
# replay; this header opens each match's block. {{.status}} is the match's
# status code ("pending"/"active"/"finished").
match_header = '-- Бой {{.code}} [{{.status}}]'

[hand_roster]
# The host's edits to the fest roster (dope/dope/domain/imports/handroster.go).
# A team saved without a name.
name_missing = "У команды нет названия."
# The same person twice in one team's list.
player_twice = '{{.name}} записан в команду дважды.'
# Another team on the roster already has this name and city.
name_taken = 'Команда «{{.name}}» уже есть в составах феста.'
# A new team picked from the rating site that the fest already has.
rating_team_taken = "Эта команда рейтинга уже есть в составах феста."
# The team is not on the fest roster (removed, or of another fest).
team_unknown = "Такой команды нет в составах феста."
# Removing a team that already has results.
team_scored = 'Команду «{{.team}}» нельзя убрать: у неё есть результаты в играх {{.games}}.'
# The rating site did not answer for a team's base roster.
base_roster_failed = "Не удалось получить базовый состав с rating.chgk.info."
# «Отменить импорт» with no import saved to go back to.
nothing_to_undo = "Отменять нечего: импортов с сохранённым составом не было."

[roster_xlsx]
# The fest roster as a spreadsheet (dope/dope/domain/imports/rosterxlsx.go):
# the columns, as the export writes them and the import finds them.
col_number = "№"
col_team = "Команда"
col_city = "Город"
col_team_id = "ID команды"
col_flags = "Зачёты"
col_player = "Игрок"
col_player_id = "ID игрока"
# A file that is not a workbook, or has nothing in it.
open = 'Не удалось открыть файл: {{.err}}'
empty = "В файле нет листов."
no_header = 'В файле не нашлась строка заголовков со столбцом «{{.column}}».'
no_teams = "В файле нет ни одной команды."
# One team of the file could not be saved, and why.
team_failed = 'Команда «{{.team}}»: {{.err}}'
unknown = "не удалось сохранить"
