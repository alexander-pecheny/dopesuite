# The Площадка surface (dope/dope/web/hostpages/venue_*.go): the public venue
# index and a venue's own page ([public]), the Representative's venue dashboard
# and the игра page under it ([host]), the registration link a Заявка is filed
# through ([reg]), the голосование that picks the турнир ([voting]) and the
# спорные a жюри still has to rule on ([contested]).

[public]
# The /venues index: page title, the search field over the table, the table's
# columns, and what it says when there is no public venue at all.
index_title = "Площадки"
index_empty = "Публичных площадок пока нет."
search_label = "Поиск"
search_placeholder = "город, название…"
col_venue = "Площадка"
col_city = "Город"
col_next_game = "Ближайшая игра"
col_registration = "Регистрация"
col_teams = "Команд"
col_rating = "Рейтинг"
# The link out to this venue on rating.chgk.info.
rating_link = "рейтинг"
# A venue's own page: the two lists of its games, and the note when it has none.
upcoming_games = "Ближайшие игры"
past_games = "Прошедшие игры"
games_empty = "Игр пока нет."
# Columns of those two lists.
col_when = "Когда"
col_tournament = "Турнир"
# The registration's state, as the index and a venue page report it.
reg_open = "открыта"
reg_closed = "закрыта"
reg_scheduled = 'откроется {{.at}}'

[host]
# The venue dashboard (venueDashDoc): its title, the jump into the public page,
# the settings form, and the delete at the bottom.
page_title = '{{.title}} · площадка'
jump_label = "Страница площадки"
jump_title = "Открыть страницу площадки"
title_label = "Название"
city_label = "Город"
description_label = "Описание (markdown)"
slug_label = "Slug (URL вида /venue/{slug})"
slug_hint = "Только латиница в нижнем регистре, цифры и дефис; не одни цифры"
public_label = "Публичная"
save_submit = "Сохранить"
delete_subhead = "Удаление"
delete_venue_confirm = "Удалить площадку? Все игры, заявки и результаты будут удалены."
delete_venue_submit = "Удалить площадку"
# The venue's games: the list, its empty note, and the create form.
games_subhead = "Игры"
games_empty = "Игр пока нет."
# A game row: its date, or this when it has none, then the tournament and the
# counts of accepted and pending заявки.
game_undated = "без даты"
game_no_tournament = "турнир не выбран"
game_accepted = ' · принято {{.n}}'
game_pending = ', ждут {{.n}}'
new_game_summary = "Новая игра"
new_game_submit = "Создать игру"
# The create-venue form on the host landing.
# The Площадки a user represents, on the host landing.
venues_empty = "Площадок пока нет."
venue_unlisted = "непубличная"
create_venue_summary = "Создать площадку"
create_venue_submit = "Создать"
rating_venue_label = "Площадка на rating.chgk.info"
rating_venue_placeholder = "город, название или id"

[game]
# The игра page (slotPageDoc) — one venue game with its registration, its
# заявки, its голосование and its спорные. A game with no date yet is titled
# with this.
undated_title = "Игра без даты"
subhead = "Игра"
# The button through to the table the game is played on.
table_btn = "Таблица игры"
# The game's own form: when it plays, which tournament, when registration opens
# and whether it is shut, and whether the link is handed over at all.
datetime_label = "Дата и время"
tournament_label = "ID турнира на rating.chgk.info"
reg_opens_label = "Регистрация открывается"
reg_opens_placeholder = "сразу"
reg_closed_label = "Регистрация закрыта"
link_visible_label = "Ссылка видна"
# Cloning a game into the next week's sitting.
clone_btn = "Клонировать"
clone_title = "Клонировать игру"
clone_note = "Копируются настройки игры и новая ссылка: без турнира, заявок и голосования."
clone_datetime_label = "Дата и время новой игры"
clone_cancel = "Отмена"
# Deleting the game, which takes its Слот and everything hanging off it.
delete_confirm = "Удалить игру? Заявки, составы, голосование и результаты будут удалены."
delete_submit = "Удалить игру"
# The registration link: the section, what stands in for the link while it is
