# The Хамса screen (dope/dope/web/ts/hamsa.ts): the бой sheet with its five
# game rounds, the общий зачёт table, the Жеребьёвка panel on the Сетка
# (dope/dope/web/ts/fest-grid.ts) and the per-player statistics
# (dope/dope/web/ts/hamsa-stats.ts).

# The page title when neither the fest view nor the scheme names the game.
title = "Хамса"

[round]
# The five раунды боя, as the регламент names them. The first four play темы;
# the fifth is one вопрос on a ставка.
light = "Светлый"
half_dark = "Полутёмный"
dark = "Тёмный"
personal = "Персональный"
team = "Командный"
# A game round's header over its темы: its number and its name.
head = 'Раунд {{.n}} · {{.name}}'
# The same, where the round pays a multiple of the base номиналы.
head_multiplied = 'Раунд {{.n}} · {{.name}} ×{{.multiplier}}'
# The перестрелка's own column group — an extra Персональный раунд on a
# reserve тема, played only where the блок allows it.
shootout = "Перестрелка"

[protocol]
# The бой sheet.
# A тема's own header. It stands over the тема's score, one column wide, so it
# names the тема and nothing else — what the вопросы are worth is written
# across their own headers.
theme = 'Т{{.n}}'
# The ставка cell, and what a reader hears on it. The Командный раунд's column
# is headed by the word: the host types the number there and marks the answer
# under it.
bet = "Ставка"
bet_title = '{{.team}}: ставка'
# The tooltip of one answer cell: the team, the тема and the вопрос's номинал.
answer_title = '{{.team}}, тема {{.theme}}, {{.value}}'
# The same on a перестрелка cell, whose вопросы pay the Персональный раунд's
# номиналы.
shootout_answer_title = '{{.team}}, перестрелка, {{.value}}'
# The перестрелка's head over its score column, one column wide like «Т1».
# The round row above it already says «Перестрелка».
shootout_theme = "П"
# The «Закончен» checkbox in a бой's head.
finished = "Закончен"
# The Σ+ column, after the темы.
plus = "Σ+"
# The trailing count columns, as on ЭК's sheet: how many вопросы the team took
# at each position of a тема. A Хамса вопрос is worth a different номинал in
# every раунд, so the columns are named by position and not by value.
question_count = 'Q{{.n}}'
# The жребий in the place cell of teams that ended a бой level on the score.
# They share the place in the сумма мест; the жребий says which of them goes
# to the next game from the higher place. The host picks 1 for the higher one.
lot_title = '{{.team}} делит место с другими командами. Выберите жребий: команда с номером 1 пойдёт в следующую игру с более высокого места.'
# The same, when the бой is finished and the жребий is still missing, so the
# next game cannot seat these teams yet.
lot_missing = '{{.team}} делит место с другими командами. Пока не выбран жребий, эти команды не попадут в следующую игру.'
# A бой nobody has been seated in yet.
unseated = "Мест ещё нет"
# The placeholder of a seat the Structure has not filled.
seat = 'Место {{.n}}'

[table]
# The Общий зачёт tab: a Block's own standings.
place = "Место"
team = "Команда"
# The columns the Block ranks by, named as the регламент names them.
place_sum = "Сумма мест"
total = "Очки"
first = "Первых мест"
# The seed is the place in the письменный отбор, counted again after the
# teams that declined, so a team that moved up reads its new number here.
seed = "Посев"
bouts = "Игр"
# A table the Ranker has not written yet.
empty = "Таблица появится, когда сыграют первый бой."

[draw]
# The empty option of the жребий select under a shared place.
none = "—"
