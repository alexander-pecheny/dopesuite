# The fest grid page (dope/dope/web/ts/fest-grid.ts) and the fest roster tab
# (fest-roster.ts): bout boxes and group tables on the grid, the reseed
# panel, and the team-to-players roster.

[reseed]
# The calculate button before the reseed has any rows.
calculate = "Рассчитать"
# The same button once rows exist.
recalculate = "Пересчитать"
# Tooltip on the disabled button when no more specific reason is known.
blocked_default = "Исходные бои ещё не закончены"
# The blocked-reason line naming the one pending bout.
blocked_one = 'Бой {{.match}} не закончен'
# The blocked-reason line naming the pending bouts, comma-joined.
blocked_many = 'Бои {{.matches}} не закончены'
# The reseed standings table's place column.
col_place = "Место"
# The reseed standings table's team column.
col_team = "Команда"
# The reseed standings table's source-bout column, present only when the
# entries come from more than one bout.
col_match = "Бой"
# The panel's empty state before the first calculation.
empty = "Пересев пока не рассчитан."

[draw]
# The Жеребьёвка panel on the Сетка (dope/dope/web/ts/fest-grid.ts): the seats
# of a раунд that no result fills, which the organiser draws by lot.
title = "Жеребьёвка"
# One row of the panel: the бой the drawn seat is in.
seat = 'Бой {{.bout}}'
# The empty option of a seat's select.
none = "—"
# What the panel says while the раунд it draws from is still being played.
pending = "Жребий откроется, когда закончатся бои предыдущего раунда."

[grid]
# The place column head of a bout box or group table.
col_place = "М"
# The default title of a bout without its own: the sheet letter, else the code.
match_default = 'Бой {{.code}}'
# A slot seated from a seed basket.
slot_basket = 'К{{.basket}}-{{.number}}'
# A slot fed by the reseed stage when its rank is not known yet.
slot_reseed = "Пересев"
# A slot fed by the reseed stage, with the rank.
slot_reseed_ranked = 'Пересев-{{.rank}}'
# The table a bout plays at.
venue = 'пл. {{.n}}'
# The table a bout plays at, when the venue has its own title.
venue_titled = 'пл. {{.n}} ({{.title}})'

[metric]
# Column names the reseed panel uses, keyed by the sort metric. The symbol
# labels (Σ, Σ+, the ± point tallies, +/−) stay in the code.
# The sum of places.
place_sum = "Σ мест"
# The tie-break metric.
tiebreak = "П"
# The share of points taken.
points_share = "% очков"
# The share of questions taken.
taken_share = "% взятых"
# Points taken without penalties.
taken_base = "Взятые б/п"
# The rating points.
points = "Очки"
# The rating metric.
rating = "Р"
# The questions taken.
taken = "Взятые"
# The bouts played.
bouts = "Боёв"
# Эрудит-секстет's stage score: Σ + 200 − 50 × место, summed over the games.
stage = "Баллы"
# A Swiss stage's record, and the seed a troika entered it with.
wins = "Победы"
losses = "Поражения"
seed = "Посев"
# The draw metric.
draw = "Жребий"

[metric_short]
# One-letter grid forms for the metrics whose names do not fit a column.
# Points.
points = "О"
# Taken.
taken = "В"
# Bouts.
bouts = "Б"
# The sum of places.
place_sum = "ΣМ"

[roster]
# The roster tab on any game page, before the roster arrives.
empty = "Составы пока не заданы."
# The line shown while the roster is loading.
loading = "Загрузка составов…"
# The line shown when the roster request fails.
load_failed = "Не удалось загрузить составы."
# The roster table's team column.
col_team = "Команда"
# The roster table's players column.
col_players = "Игроки"
# A Тройка game's roster: the troika column, and under a troika's name the
# team it counts for (its зачёт follows after a dot).
col_troika = "Тройка"
for_team = 'за {{.team}}'
# Under a team's name on the roster tab: the host changed this team's roster
# for this game only.
hand_note = "Состав изменён для этой игры"
# A Тройка game's roster tab, for the host: where a troika's people are edited.
troikas_link = "Составы троек меняются на странице «Тройки»"

[roster_edit]
# The pencil on a team's row of the roster tab.
label = 'Изменить состав команды «{{.team}}»'
# The dialog's heading.
title = 'Состав команды «{{.team}}» в этой игре'
# What the dialog says above the list.
hint = "Изменения касаются только этой игры. Составы в фесте и в других играх остаются прежними."
# The field that adds a player, and its button.
add_placeholder = "Имя и фамилия"
add = "Добавить"
# The cross beside a player.
remove = 'Убрать: {{.player}}'
# Beside a player who already has results in this game and cannot be removed.
locked = "Уже играл в этой игре, поэтому убрать нельзя"
save = "Сохранить"
cancel = "Отмена"
# Gives the team back its fest roster, and asks first.
reset = "Вернуть состав из феста"
reset_confirm = 'Вернуть команде «{{.team}}» состав из феста? Изменения, сделанные в этой игре, пропадут.'
# The errors a save or a reset can meet.
wrong_format = "В этой игре составы команд не меняются."
team_not_in_game = "Этой команды нет в игре."
empty = "В составе должен быть хотя бы один игрок."
player_twice = '{{.player}} уже есть в составе.'
player_has_results = '{{.player}} уже играл в этой игре, поэтому из состава его не убрать.'
failed = "Не удалось сохранить состав."
