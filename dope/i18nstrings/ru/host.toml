# Hint above the sticker rows of the stickers-KSI section.
stickers_hint = "Для каждого стикера задайте, сколько штук есть у команды (0 — стикер не используется) и цвет для подсветки. «Обычный» стикер работает как стандартная тема КСИ."
# Label of one sticker row's max-count field.
sticker_max_label = "Макс."
# The neutral sticker's name: the create-form row and the sticker label the
# scheme config stores.
sticker_neutral = "Обычный"
# Row labels of the three special stickers on the stickers-KSI create form.
sticker_x2_row = "×2 (правильные и неправильные удваиваются)"
sticker_nowrong_row = "Без минуса (неправильные = 0)"
sticker_emptywrong_row = "Пустой = минус (пустые = −номинал)"
# Sticker labels the scheme config stores for the special stickers.
sticker_nowrong = "Без минуса"
sticker_emptywrong = "Пустой = минус"
# Label of the scheme editor (brain / SI / troika / EK sections, settings page).
scheme_label = "Схема"
# Hint under the brain scheme editor.
brain_hint = "Формат описан в docs/scheme-dsl.md: блоки [scheme] через ---, kind: roundrobin / single_elimination / double_elimination."
# Hint under the personal-SI scheme editor.
si_hint = "Тот же язык схем: за столом сидят игроки, а не команды. Бой на троих — match_size: 3, проходят двое — winning_places: 2."
# The mini-games section of the multi create form.
minigames_label = "Мини-игры"
# Placeholder of the mini-games editor (one sample line per mini-game).
minigames_placeholder = "Фоторяд: {0,1}x10\nЛогика: {0,3}x2 {0,5}\nШтрафной: {-1,0,1}x10\nПесни →0..100: {0,1}x72"
# Hint under the mini-games editor: the line grammar.
minigames_hint = "По строке на мини-игру: «Название: {значения}xN». {0,1} — задание на 0 или 1 балл, {-1,0,1} — со штрафом, {0-12} — любое целое от 0 до 12. Несколько описаний в строке идут подряд: «{0,3}x2 {0,5}» — три задания на 3, 3 и 5 баллов. «|» закрывает блок листа: «{0,1}x10 | {0,1}x10» — два блока по десять, с зазором и сквозной нумерацией."
# Hint under the mini-games editor: the →0..100 share syntax.
minigames_share_hint = "«Название →0..100: …» — мини-игра идёт в итог не своими баллами, а долей от лучшего результата в ней, из ста. Так мини-игры разного масштаба весят в итоге поровну; ушедшим в минус засчитывается ноль."
# The tie-break field of the multi create form and its hint.
multi_sorting_label = "Что решает при равном итоге (необязательно)"
multi_sorting_hint = "Через запятую: total — итог, plus — сумма положительных, game1, game2… — подытоги мини-игр по порядку. Пусто — команды с равным итогом делят место."
# Hint under the troika scheme editor.
troika_hint = "Тот же язык схем. themes — сколько тем в бою, theme_values — во сколько баллов каждая. Рейтинговый балл описывается правилом подсчёта: points: [1, 0.5, 0] и standings.rating: points + taken / 50."
# The scheme the hamsa creation form prefills: the tournament's own shape at
# its smallest, with n the participants the fest can seat four to a table. It
# is text a host reads and edits, so it lives here rather than in the form.
hamsa_scheme = """[defaults]
venues: [А, Б, В]

[scheme]
title: Групповой этап
kind: placement
participants: {{.n}}
match_size: 4
rounds: 2
title.r1: Игра №1
title.r2: Игра №2
proceeding_participants: 4
sorting: [place_sum, total, first, seed]
---
title: Финал
kind: flat
participants: 4
reseed: true
stats_from: [s1]
sorting: [place_sum, total, first, seed]
shootout: true
"""
# Hint under the hamsa scheme editor.
hamsa_hint = "Тот же язык схем. kind: placement — групповой этап, где команды не вылетают, а везут места дальше: раунд 1 сеет полосами посева, каждый следующий сажает за стол k места k всех столов, а остатки разыгрываются жребием на Сетке. Письменный отбор играется отдельной игрой КСИ; чтобы посеять отсюда, добавьте [init] seed: <код той игры>."
# Hint under the EK scheme editor (before the pasted-JSON field).
ek_hint = "Либо схемой, либо готовым JSON ниже — что заполнено, то и используется."
# Hint under the Эрудит-Секстет scheme editor: the same language, plus the
# per-theme seat cap the format adds.
es_hint = "Тот же язык схем, что у ЭК. players — сколько игроков команда выводит на тему (по умолчанию 3, можно по раундам: players.r3: 2)."
# Label of the EK pasted-JSON editor.
ek_json_label = "JSON-схема"
# Hint at the top of the entrant picker. Shown only for the formats described by
# a scheme: those deal their own numbers from one.
entrants_hint = "Отметьте, кто играет в этой игре. Если никого не отметить, играют все. Номера эта игра раздаёт свои, начиная с единицы, поэтому одна и та же команда может быть второй в ЭК и четвёртой в брейне. Командная игра сажает за стол команды, личная — игроков: сначала идут команды, потом игроки."
# Summary of the entrant-picker disclosure.
entrants_summary = "Состав игры"
# Hint under the settings of the flat formats, which have no entrant picker:
# they seat the whole fest roster under the fest's numbers.
whole_roster_hint = "Играют все команды феста, под теми же номерами. Кто не играл, отмечается во вкладке «Отказы» на странице игры."
# The settings-page form: name and slug fields, the scheme-rebuild hint, submit.
title_label = "Название"
slug_label = "Slug (необязательно, a-z, 0-9, дефис)"
rebuild_hint = "Пересборка меняет только не начатые бои: можно поменять число вопросов или добавить блок, но начатый бой должен сохраниться без изменений."
save_submit = "Сохранить"
# Field name the sticker max-count validation errors use.
