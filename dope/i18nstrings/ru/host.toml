# The hostpages surface (dope/dope/web/hostpages): the game create/settings
# forms ([games]), the fest roster pages ([roster]: teams, players, overrides
# and the two imports), the fest dashboard ([dash]) and the host landing,
# profile and public viewer pages ([pages]).

[games]
