# Shared game-page chrome and small page configs, in the order the widgets
# appear: the touch cell-nav bar and on-screen keypad, the sync-status dot,
# the spectator tally, the diagnostics recorder button, then one table each
# for the score-table header fallback, the venues widget, the host profile
# password form and the menu's host account entry.

[cell_nav]
# The floating ↑/↓ bar above the on-screen keyboard: the two buttons' aria-labels.
prev = "Предыдущая ячейка"
next = "Следующая ячейка"

[keypad]
# The on-screen numeric keypad: the nav row's and backspace key's aria-labels.
prev_column = "Предыдущая колонка"
prev_row = "Предыдущая строка"
next_row = "Следующая строка"
next_column = "Следующая колонка"
backspace = "Удалить"

[status]
# The sync-status dot's tooltip/aria-label, one per connection state.
saved = "Синхронизировано"
saving = "Синхронизация"
reconnecting = "Переподключение"
error = "Ошибка"

[viewers]
# The live spectator tally beside the sync-status dot: the aria-label, then
# the hover title with the current count.
label = "Зрителей онлайн"
title = 'Зрителей онлайн: {{.n}}'

[recorder]
# The fixed diagnostics button that downloads this tab's state journal.
label = "Скачать лог"
title = "Скачать журнал состояния этой вкладки (для диагностики)"

[score_table]
# The score table's place-column header, the default when a page passes none.
place = "М"

[venue]
# The venues table's name column header.
name_column = "Название"
# A bout's venue with a title: the table number, then the title.
battle = 'пл. {{.n}} ({{.name}})'
# A bout's venue without a title, and the short form.
battle_short = 'пл. {{.n}}'
# A bout's venue with the start time the host gave it, the venue first.
# {{.venue}} is the venue as above, and may be empty.
with_time = '{{.venue}} {{.time}}'
# A bout's venue number and time, then the venue's title (its room).
with_title = '{{.where}}, {{.title}}'
# The venues table's hosts column.
hosts_column = "Ведущие"
# The add row under the host's venues table: the title field's placeholder,
# the number field's label (left empty, the venue takes the next free
# number, which the field shows as its placeholder) and the button.
add_title = "Новая площадка"
add_number = "Номер площадки"
add = "Добавить"
# The button that deletes a venue no bout plays at.
delete = "Удалить площадку"
# The fest's venues page: each venue's bouts, the column heads, and the
# line under a venue no bout plays at.
schedule_time = "Время"
schedule_game = "Игра"
schedule_bout = "Бой"
schedule_empty = "Боёв здесь нет."
# The line over a Game's venues tab, for a host. An empty field there shows
# the fest's value, which it holds as its placeholder.
game_intro = "Площадки общие для всего феста. Здесь можно задать название и ведущих только для этой игры, снять площадку, на которой игра не идёт, и добавить свою. Пустое поле берёт значение феста."
# A venue's heading on that page: its number and title.
schedule_head = '{{.n}}. {{.title}}'
# The heading of a venue one game has for itself.
schedule_head_game = '{{.n}}. {{.title}} (только {{.game}})'
# A game's venues tab: the column that ticks the fest venues the game plays at.
used_column = "В этой игре"

[profile]
# The host profile page's password form messages.
mismatch = "Пароли не совпадают."
changed = "Пароль изменён."

[menu]
# The ☰ menu's host account entries (window.dopeMenuConfig).
profile = "Профиль ведущего"
login = "Вход для ведущего"

[group_stats]
# Arithmetic parser errors in evalScoringRule (group-stats.ts).
paren = "скобка"
truncated = "обрыв"
no_token = 'нет {{.token}}'


[tab_picker]
# The button a tab strip turns into when its tabs do not fit, which lists
# every tab to jump to one: its tooltip and aria-label.
label = "Все вкладки"
