# The tournament structure builders (dope/dope/domain/structure): the titles
# they write into stages, bouts and seating labels, and the errors a scheme
# author reads when a block's config does not fit.

# Default names shared by several kinds: a bout, a bracket round, the final.
[titles]
# The n-th bout of a stage — a match title in a drawn stage, a feed label of a
# block that offers its bouts on, and the rr default match title.
bout = 'Бой {{.n}}'
# The n-th round of a multi-round bracket: a single-bracket DE round, and the
# non-terminal rounds of an elimination.
block_round = 'Раунд {{.n}}'
# The final: the knockout bracket's last round, the single final match of the
# legacy static schedule, and the feed label of the group the final feeds on.
final = "Финал"

[se]
# The single_elimination block. Round titles first, then the config errors
# the scheme author reads on the game settings page.
# The round of semifinals: four entrants remain, two bouts play.
block_round_semifinals = "Полуфиналы"
# An earlier round, named by the fraction it leaves: "1/4 финала" when eight
# remain (n is remaining/2).
block_round_nth = '1/{{.n}} финала'
# A semifinal match of the legacy static schedule, one per semifinal bout.
match_semifinal = 'Полуфинал {{.index}}'
# A match of an earlier round of the legacy static schedule, one per bout.
match_nth_block_round = '1/{{.n}} финала {{.index}}'
# A bout of the best-of final series.
final_bout = 'Финал. Бой {{.n}}'
# The bronze bout, and the bronze stage title when it is a single bout.
bronze = "Матч за 3-е место"
# A bout of the best-of bronze series.
bronze_bout = 'Матч за 3-е место. Бой {{.n}}'
# A block without the participants key.
participants_missing = "single_elimination: нужен participants"
# pairing: a value other than adjacent or halves.
pairing_unknown = 'pairing: не понял {{.value}}. Бывает adjacent (соседние бои, как по умолчанию) или halves (бой 1 с боем N/2+1, 2 с N/2+2…).'
# pairing: halves on a round that cannot pair the previous round's bouts two
# by two: the opening round, a round seated by a reseed, or one whose bouts
# take more or fewer than two previous bouts each.
pairing_halves_needs_bouts = 'pairing: halves в раунде {{.round}} не подходит. Нужно, чтобы каждый бой раунда получал участников ровно из двух боёв предыдущего раунда и чтобы между раундами не было пересева.'

# A reseed naming a round the block does not have.
reseed_block_round_unknown = 'reseed: в этом блоке нет раунда {{.round}}'
# A reseed naming the opening round, which needs reseed: true instead.
reseed_first_block_round = 'reseed: {{.round}} — первый раунд, пишите reseed: true'
# A best_of value that is not an odd number of bouts from 3.
best_of_parity = "best_of: серия играется до большинства побед — нечётное число боёв от 3"
# A best_of set on a round that is not the final or the bronze.
best_of_final_only = "best_of: серия возможна только в финале или матче за 3-е место"
# The block follows one that declared no proceeding_participants.
proceeding_missing = "предыдущему блоку нужен proceeding_participants, чтобы продолжить схему"
# draw: true on a bracket that does not follow groups sending two places each
# into bouts of two.
draw_template = "draw: жеребьёвка сажает победителей групп против вторых мест, поэтому нужны группы с proceeding_participants: 2, бои на двоих и participants, равный удвоенному числу групп"
# The label of a drawn seat while it is empty: which place of a group it takes.
draw_seat = 'Жребий: {{.place}}-е место группы'
# The previous block's seating template does not fit bouts of this size.
template_size = 'нет шаблона рассадки в бои по {{.size}} из предыдущего блока — добавьте reseed: true'
# The previous block's groups do not pair into a bracket template.
template_groups = "нет шаблона рассадки из этих групп — добавьте reseed: true"

[elimination]
# The shared elimination-round planner behind single_elimination and
# double_elimination: how the rounds, bouts and lives fit together.
# winning_places below one.
winning_places_min = "winning_places должен быть хотя бы 1"
# match_size below two.
match_size_min = "match_size должен быть хотя бы 2"
# A bout whose seat count does not exceed the winners it must produce.
bout_cannot_output = 'бой на {{.size}} мест не может выводить {{.winning}} — победителей не меньше, чем мест'
# A round whose entrants do not split evenly into bouts of the asked size.
block_round_not_divisible = 'раунд {{.round}}: {{.entrants}} участников не делятся на бои по {{.size}}'
# A round whose winners would be as many as its entrants.
block_round_eliminate_nothing = 'раунд {{.round}} никого не выбивает: {{.entrants}} участников, {{.proceeding}} проходит'
# The bracket did not terminate within a sane number of rounds.
too_many_block_rounds = "слишком много раундов — проверьте match_size и winning_places"
# An elimination with lives set below one.
lives_min = "нужна хотя бы одна жизнь"
# A complaint of one bracket of a lives elimination, pinned to its round.
block_round_bracket = 'раунд {{.round}}, сетка {{.bracket}}: {{.err}}'
# lower_entrants out of range: negative, the whole field, or a bracket with
# one life, which has no lower bracket to start in.
lower_entrants = 'lower_entrants: {{.lower}} из {{.entrants}} — в нижнюю сетку можно посадить от 0 до {{.entrants}}−1 участников, и только когда жизней две'
# A bracket whose members do not split evenly into bouts of the asked size.
bracket_not_divisible = '{{.entrants}} участников не делятся на бои не больше чем по {{.size}}, из которых выходит {{.winning}}'

[de]
# The double_elimination block: pods of four, or one bracket with lives.
# Neither groups nor group_size nor a participants count divisible by four.
groups_needed = "double_elimination: нужен groups (или participants, кратный 4)"
# No headcount the block could work from.
participants_needed = "double_elimination: нужен participants (или groups и group_size)"
# The resolved group count or group size is too small to play.
bad_groups = 'double_elimination: {{.groups}} групп по {{.size}} — так не бывает'
# A reseed: value naming a round — the block only takes true/false.
reseed_block_round_unknown = 'reseed: в этом блоке нет раунда {{.round}} — только true/false'
# The stage title of a single-bracket elimination.
playoff = "Плей-офф"
# A bouts key with no round, or for the first round, which opening seats.
bouts_round = "bouts пишется по раундам начиная со второго: bouts.r2, bouts.r3, … Первый раунд задаёт opening"
# A written round with the one before it missing.
bouts_gap = '{{.key}}: перед ним нет {{.prev}}'
# Written rounds on a block of several brackets.
bouts_one_bracket = "bouts.rN расписывают одну сетку: groups: 1"
# Written rounds together with a re-rank between rounds.
bouts_reseed = "bouts.rN и reseed: true вместе не работают: раунды уже расписаны"
# A bout name that is empty, taken, or holds the place separator.
bouts_name = '{{.key}}: имя боя «{{.name}}» пустое, уже занято или содержит «-»'
# A written bout with no more seats than go on from it.
bouts_size = '{{.key}}: в бою «{{.bout}}» мест не больше, чем выходит дальше ({{.winning}})'
# A seat that is not bout-place.
bouts_seat = '{{.key}}: «{{.token}}» — нужен бой и место, например E-1'
# A seat naming a bout not played before this round.
bouts_unknown = '{{.key}}: боя «{{.bout}}» раньше не было'
# A seat naming a place the bout does not have.
bouts_place = '{{.key}}: в бою нет места «{{.token}}»'
# A seat naming a place of the grand final.
bouts_after_final = '{{.key}}: {{.token}} — место в финале, после него боёв нет'
# A place seated in two bouts.
bouts_twice = '{{.key}}: {{.token}} уже сидит в другом бою'
# A place whose holder has already lost twice.
bouts_out = '{{.key}}: {{.token}} к этому раунду уже выбывает'
# A written round with no bouts in it.
bouts_empty = '{{.key}}: раунд без боёв'
# A written bout with no name before its seats.
bouts_unnamed = '{{.key}}: у боя «{{.bout}}» нет имени, напишите его перед местами: «M: E-1 F-2»'
# The block sends on more than its last written round leaves in.
bouts_proceeding = 'proceeding_participants: {{.proceeding}}, а после последнего раунда остаётся {{.left}}'
# A place that is still in and that no later bout takes.
bouts_unused = '{{.token}} ещё не выбыл, но ни один бой его не берёт'

[rr]
# The roundrobin block: groups seated from the incoming edge, ranked by the
# block's comparators.
# No group_size given.
group_size_needed = "roundrobin: нужен group_size"
# group_venues outside 1..the бои of one round.
group_venues_range = 'group_venues: от 1 до {{.max}}, столько боёв в одном круге группы'
# group_venues times the groups is more than the block's venues.
group_venues_too_few = 'group_venues: группам нужно {{.need}} площадок, а у блока их {{.have}}'

# The feed label of the block's n-th group, as the next block's seating reads it.
group_feed = 'Гр. {{.n}}'
# A points list that is not exactly win, draw, loss.
points_list = "points: жду [победа, ничья, поражение]"
# More rounds asked than the schedule construction can provide.
too_many_block_rounds = 'rr: {{.rounds}} кругов на {{.entrants}} участников по {{.size}} — есть только {{.have}}'
# No schedule construction exists for this headcount and seat count.
no_schedule = 'rr: нет расписания на {{.entrants}} участников по {{.size}} за столом'
# A pairings list, or one round of it, with no bouts.
pairings_empty = 'pairings: в {{.round}}-м круге нет боёв'
# A pairings seat that is not a position in the group.
pairings_seat = 'pairings: «{{.token}}» — не место в группе (от 1 до {{.size}})'
# A pairings round that seats one position twice.
pairings_twice = 'pairings: в {{.round}}-м круге место {{.token}} играет дважды'
# A pairings bout whose seat count is not the block's match_size.
pairings_bout_size = 'pairings: в бою {{.bout}} должно быть {{.size}} мест'

[flat]
# The flat kind: one match seating every entrant.
# No participants key and nothing seeded.
participants_missing = "flat: нужен participants"
# The stage title of a flat game.
game = "Игра"
# The schedule ran with nobody seated.
no_entrants = "flat: за столом никого"

[placement]
# The placement block — Хамса's групповой этап: rounds of multi-seat bouts
# where the places, not the survivors, are what carries forward.
# The block's own table, which ranks every round together.
table = "Общий зачёт"
# The label of a seat the host draws, while it is still empty.
draw_seat = "Жребий"
# A block without the participants key and nothing seeded.
participants_missing = "placement: нужен participants"
# No match_size, or one below two.
match_size_missing = "placement: нужен match_size хотя бы 2"
# A headcount that does not split evenly into tables.
not_divisible = 'placement: {{.participants}} участников не делятся на столы по {{.size}}'
# More tables than a table has seats: there is nowhere to seat place k of
# every table when k runs past the seats.
too_many_tables = 'placement: {{.tables}} столов не рассадить по {{.size}} мест — столов не должно быть больше, чем мест за столом'
# A rounds value below one.
block_rounds_min = "rounds: хотя бы один раунд"
# A deal the block does not know: straight bands or the snake.
deal_unknown = 'deal: {{.deal}} — бывает straight или snake'

[swiss]
# The swiss block: rounds that pair troikas with the same record of wins and
# losses, until each has won `wins` times (it goes on) or lost `losses` times
# (it is out). The block's own table, ranked by that record.
table = "Итоги"
# A бой's title: its number in the round and the record its seats share,
# wins before losses («Бой 2 (1–0)»).
bout = 'Бой {{.n}} ({{.wins}}–{{.losses}})'
# The title of a pool: the troikas that share one record in a round, ranked
# by their seed before they are dealt into бои.
pool = 'Пул {{.wins}}–{{.losses}}'
# The label of a seat dealt from a pool while it is still empty, worded like
# seat_from_bout so every seat source reads «…, м. N».
pool_rank = 'Пул {{.wins}}–{{.losses}}, м. {{.n}}'
# A participants value the block has no plan for; the plans come from the
# regulations the format was built for.
participants_unsupported = 'swiss: нет плана на {{.participants}} участников (есть {{.known}})'
# wins or losses other than the plan's.
plan_mismatch = 'swiss: план на {{.participants}} участников играется до {{.wins}} побед и {{.losses}} поражений'
# The block was not seeded from a ranked table: its first round pairs ranks.
needs_ranking = "swiss: блок рассаживает по местам предыдущего блока — поставьте перед ним блок с таблицей"

[macro]
# Helpers every kind shares: seating labels and the sorting complaint.
# The label of a seat fed from a bout: "<bout label>, м. <place>".
seat_from_bout = '{{.bout}}, м. {{.place}}'
# The label of a seat fed from a reseed ranking.
reseed_rank = 'Пересев-{{.n}}'
# A sorting key neither the protocol nor the scoring rules measure.
unrankable_metric = 'sorting: {{.metric}} не считается — ни протокол, ни правила подсчёта такой метрики не дают (есть {{.known}})'
