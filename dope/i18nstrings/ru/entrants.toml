# A buzzer Game's Участники tab (dope/dope/domain/entrants, web/ts/entrants.ts):
# who the Game seats, where the list comes from, and the host's hand edits.
# ЭК, ЭС, брейн, Тройка, Хамса and личная СИ share it.

# The tab's name in the tab bar and the crumb trail.
tab = "Участники"
# The Тройка game's link to its troikas page.
troikas_link = "Тройки"

[source]
# The choices of the source picker. The fest's teams in their own order.
fest_teams = "Все команды феста"
# The fest's players in the order they registered, for личная СИ.
fest_players = "Все игроки феста"
# The fest's troikas, for a Тройка.
troikas = "Тройки феста"
# Another Game's current table; {{.game}} is its title.
game = 'Таблица игры «{{.game}}»'
# A Game's table counting some of its tours, as the scheme declares
# (seed: od-1[tours 1..3]).
game_tours = 'Таблица игры «{{.game}}», туры {{.tours}}'
random = "Жребий"
xlsx = "Файл xlsx"
# The by-players seeding a scheme declares ([init] seed: players).
players = "Посев по игрокам"

[filter]
# The зачёт filter beside the source picker: everybody, one Flag, or
# everybody without it.
all = "Все зачёты"
carrying = 'Зачёт «{{.flag}}»'
not_carrying = 'Не из зачёта «{{.flag}}»'

[import]
# The picker's label, and the button that runs it.
label = "Посев"
run = "Загрузить список"
# Beside the import button when the list was edited by hand: a re-import
# applies those edits again unless the box is cleared (ADR-0025).
keep_edits = 'Сохранить мои правки ({{.n}})'
# Confirm before an import that drops the hand edits.
confirm_fresh = "Загрузить список заново из источника без ваших правок? Правки пропадут."
# The file field of the xlsx source.
file = "Файл"
# The notice after an import.
done = 'В списке {{.n}} {{plural .n "участник" "участника" "участников"}}.'

[head]
# The table's columns.
seed = "Посев"
name = "Участник"
declined = "Отказ"

[row]
# The waiting-list divider: entrants beyond the Structure's seats.
waitlist = "Лист ожидания"
# Row actions, as tooltips and aria labels.
up = "Выше"
down = "Ниже"
rename = "Переименовать"
remove = "Убрать из списка"
remove_confirm = 'Убрать «{{.name}}» из списка участников?'
# Puts another entrant in this one's place, with its seed and its bouts.
replace = "Заменить"
# The field that opens in the row: who plays instead. The placeholder is short
# to fit the name column; the label names the entrant being replaced.
replace_placeholder = "Кто играет вместо"
replace_pick = 'Кто играет вместо «{{.name}}»'
# How an entrant already in the list shows among the choices: it swaps places.
# {{.name}} is its name, {{.place}} its place in the list.
replace_listed = '{{.name}} (место {{.place}} в списке)'
# The seed field: typing a number moves the entrant there.
seed_label = 'Место в посеве для «{{.name}}»'
declined_label = 'Отказ: {{.name}}'
# Shown on an entrant that sits in a бой that has begun.
played = "Уже играет: убрать, заменить, переименовать или передвинуть нельзя"
# The mark of an entrant typed in for this Game alone.
one_off = "разовый"

[add]
# The add form under the table: pick a fest team (troika, player), or type a
# one-off name.
pick ="Выберите из феста или впишите название"
pick_troika = "Выберите тройку"
submit = "Добавить"
# The hint under the form.
hint = "Новый участник встаёт в конец списка. Если свободных мест нет, он ждёт в листе ожидания, пока кто-то не откажется."
hint_troika = "Новые тройки заводятся на странице «Тройки»."
# The hint under the table: how to put somebody in another's place.
replace_hint = "Если участник снялся, нажмите «Заменить» в его строке. Замена займёт его место в посеве и в боях, остальные участники останутся на своих местах. Если отметить отказ, все участники ниже сдвинутся на одно место вверх."

[state]
# The notes over the table. The Structure follows the list while nothing is
# entered in a Game built for its entrants.
resizes = "Пока в игре нет результатов, сетка строится заново под список, если схема это позволяет. Если нет, сетка остаётся прежней, а лишние участники ждут в листе ожидания."
# The last write kept the Structure: the scheme takes no other count.
# {{.reason}} is the scheme's message.
kept = 'Сетка осталась прежней: {{.reason}}'
# An import from another source than the list's kept the host's additions and
# removals but not the moves: a place in one source's order means nothing in
# another's. {{.n}} is how many moves.
moves_dropped = 'Список загружен из другого источника, поэтому ручные перестановки ({{.n}}) не применены. Добавленные и убранные вручную участники учтены.'
# The import had nothing to rank these entrants by: nobody in them is on the
# fest roster. They were seeded last, in their order in the Game.
# {{.names}} is the list, comma-separated.
unranked = 'Посеяны последними, потому что никого из их игроков нет в составах фестиваля: {{.names}}.'
# Once something is entered the Structure stays as it is.
fixed = "В игре уже есть результаты, поэтому сетка больше не меняется. Изменения списка затрагивают только бои, которые ещё не начались."
empty = "В списке пока никого нет. Загрузите его из источника или добавьте участников по одному."
# The summary line: seated out of the seats, then everybody active.
summary = 'Мест в сетке: {{.size}}, занято {{.seated}}. Всего в списке без отказавшихся: {{.active}}.'
# A write that failed; {{.err}} is the server's message.
failed = 'Не получилось: {{.err}}'

[error]
source_missing = "Выберите, откуда загрузить список."
pick_somebody = "Выберите участника из списка или впишите название."
already_in = '«{{.name}}» уже в списке.'
name_taken = 'В списке уже есть «{{.name}}».'
name_missing = "Впишите название."
one_off_troika = "Тройку нельзя вписать названием: заведите её на странице «Тройки»."
played = '«{{.name}}» уже играет в этой игре, поэтому его нельзя убрать, заменить, переименовать или передвинуть.'
replace_self = "Участника нельзя заменить им самим."
rename_fest = "Переименовать здесь можно только разового участника. Команду феста переименуйте в списке команд феста, тройку на странице «Тройки»."

[own]
# A flat Game's Участники tab (ЧГК, минное поле, КСИ, Мультиигры): who plays
# it, the fest's teams or the Game's separate list
# (dope/dope/domain/roster/gameteams.go, web/ts/game-teams.ts).
follow = "Как на турнирном сайте"
own = "Отдельный список"
# A Game the game may follow, in the source dropdown.
source_game = 'Как в игре «{{.game}}»'
# Confirm leaving the separate list, which goes.
drop_list_confirm = "Отдельный список пропадёт, и игра снова будет брать команды из источника. Продолжить?"
# The separate list's buttons.
add_team = "Добавить команду"
clear = "Очистить"
clear_confirm = "Убрать из списка все команды?"
xlsx_import = "Загрузить из xlsx"
xlsx_sample = "Скачать образец xlsx"
# The table's columns.
number = "№"
name = "Команда"
flags = "Зачёты"
players = "Игроки"
# A row's actions, and why a team the Game holds answers for keeps its row.
edit = 'Изменить «{{.team}}»'
remove = "Убрать из списка"
remove_confirm = 'Убрать команду «{{.team}}» из списка игры?'
entered_note = "В игре уже есть её ответы"
# The summary line over the table.
summary = '{{.n}} {{plural .n "команда" "команды" "команд"}} в игре'
empty = "В игре пока нет команд."
# The refusals.
not_flat = "У этой игры свой список участников: его правят на вкладке «Участники» игры."
follows = "Сначала выберите «Отдельный список»."
entered = '«{{.name}}» нельзя убрать: в игре уже есть её ответы. Сначала очистите их.'
name_missing = 'Впишите название команды в строке {{.row}}.'
number_missing = 'Впишите номер команды «{{.name}}».'
number_taken = 'Номер {{.number}} у двух команд: «{{.first}}» и «{{.second}}».'
has_list = "У игры отдельный список: правьте команды прямо в нём."
tethered = "Эта игра берёт составы из источника: игроков меняют оверрайды на вкладке «Участники»."
bout_no_list = "У игры с боями нет отдельного списка: кто играет, решает список участников ниже."
cycle = "Так не получится: эта игра сама берёт команды из выбранной."
override_failed = "Этот оверрайд не применить к командам игры."
# A change upstream the Game cannot take: a team with answers needs a number
# another team now has.
number_conflict = 'Список не обновлён: номер {{.number}} нужен команде «{{.held}}», у которой есть результаты, а его заняла «{{.team}}».'

[overrides]
# A tethered game's overrides (dope/dope/web/ts/game-overrides.ts, ADR-0038):
# the list under the table, the dialog that adds one, and the badges.
title = "Оверрайды"
# The line over a bout game's entrant list: where its teams' names and
# players come from.
source_label = "Составы команд"
add = "Добавить оверрайд"
remove = "Убрать оверрайд"
not_applied = "оверрайд не применён"
badge = "оверрайд"
missing = "нет в источнике"
kind = "Что изменить"
kind_rename = "Переименовать команду"
kind_city = "Изменить город команды"
kind_flags = "Изменить зачёты команды"
kind_add_team = "Добавить команду"
kind_remove_team = "Убрать команду"
kind_add_player = "Добавить игрока"
kind_remove_player = "Убрать игрока"
kind_move_player = "Игрок за другую команду"
team = "Команда"
name = "Новое название"
city = "Город"
flags = "Зачёты"
player = "Игрок"
to = "За какую команду"
# An override as the list says it.
text_rename = '«{{.team}}» называется «{{.name}}»'
text_city = 'Город команды «{{.team}}»: {{.city}}'
text_flags = 'Зачёты команды «{{.team}}»: {{.flags}}'
text_number = '«{{.team}}» под номером {{.number}}'
text_add_team = 'Добавлена команда «{{.team}}»'
text_remove_team = 'Убрана команда «{{.team}}»'
text_add_player = '{{.player}} в составе «{{.team}}»'
text_remove_player = '{{.player}} не в составе «{{.team}}»'
text_move_player = '{{.player}} играет за «{{.team}}»'
