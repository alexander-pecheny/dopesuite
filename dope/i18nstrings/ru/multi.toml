# The Мультиигры screen (dope/dope/web/ts/multi.ts): the sheet of мини-игры
# column blocks with their subtotals and Итог, the ranked «Итог» table, the
# teams tab (refusals and the game's guest teams) and the tab bar.

# The page title when neither the fest view nor the scheme names the game.
title = "Мультиигры"

[tabs]
# The tab bar labels.
detailed = "Подробно"
results = "Итог"
refusals = "Команды"
roster = "Составы"

[sheet]
# The «Подробно» sheet: the team and total column headers.
team = "Команда"
total = "Итог"
# The titles of the team column's two sort buttons, «№» and «Команда».
sort_by_number = "Сортировать по номеру"
sort_by_name = "Сортировать по названию"

[game]
# A мини-игра column block's head when its tasks all pay the same:
# «Не только песни (по 1)».
uniform_price = '{{.name}} (по {{.n}})'

[results]
# The «Итог» table: the place (М for место), team and total column headers.
place = "М"
team = "Команда"
total = "Итог"
# The column of a team's places summed across the мини-игры, shown when the
# fest ranks on it (place_sum).
place_sum = "Сумма мест"
# A мини-игра's cell when the fest ranks on places: the score and, in
# brackets, the place it earned in that мини-игра.
score_and_place = '{{.score}} ({{.place}})'

[refusals]
# The «Команды» tab: the team and refused-to-play column headers.
team = "Команда"
declined = "Отказ"

[guests]
# The «Команды» tab's guest teams: teams the host adds to this one game by
# name alone. The hint under the add form.
hint = "Разовая команда играет только в этой игре. В рейтинге и в других играх феста её нет. Убрать её можно, пока у неё нет баллов и отказа."
# The add form's name field.
name_placeholder = "Название разовой команды"
# The add form's button.
add = "Добавить команду"
# The pencil button on a guest team's row, and its name field's label.
rename_label = "Переименовать"
# The bin button on a guest team's row.
remove_label = "Убрать из игры"
# The confirmation before a guest team is removed.
remove_confirm = 'Убрать команду «{{.name}}» из игры?'
# A guest-team edit the server refused; error is its reason.
failed = 'Не получилось: {{.error}}'
