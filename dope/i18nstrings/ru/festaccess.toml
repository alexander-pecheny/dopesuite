# The fest access page (host settings): saving the member list, the
# add-by-nickname form and the bulk paste-a-list import
# (dope/dope/storage/festaccess).

[manage]
# The signed-in role may not manage access; both the form save and the bulk
# import stop here.
denied = "нет прав менять доступ"

[add]
# The add-by-nickname form submitted with an empty nickname.
nickname_required = "введите никнейм"
# The add form's role is not one the page can hand out.
role_invalid = "для нового доступа выберите admin или host"
# The nickname typed into the add form matches no user; the quotes are the
# Go %q the call site renders.
user_not_found = 'пользователь "{{.name}}" не найден'
# The nickname typed into the add form is the fest's creator.
creator_exists = "создатель уже есть в доступе"

[bulk]
# The paste box holds no parsable line.
empty = "вставьте хотя бы одну строку"
# A pasted line names a user that does not exist.
user_not_found = 'строка {{.n}}: пользователь "{{.name}}" не найден'
# An error from one pasted line, prefixed with its line number.
line_prefix = 'строка {{.n}}: {{.msg}}'

[member]
# Trying to delete or change the fest creator's row.
creator_protected = "создателя нельзя удалить или изменить"
# A member row's new role is not admin, host or game_jury.
role_invalid = "роль должна быть admin, host или game_jury"

[games]
# The API's per-host Game limits (POST …/access with games).
# A user named in games who is not a host of the fest: only a host is limited.
not_host = 'пользователя {{.name}} нельзя так ограничить. По играм ограничивают ведущего или жюри игры, по площадкам только ведущего'
# A Game named in games that this fest does not have (by id, code or slug).
unknown = 'в фесте нет игры «{{.game}}»'
# A venue named in venues that this fest does not have (by id or title).
unknown_venue = 'в фесте нет площадки «{{.venue}}»'
# A host of a synch fest left with no venue: such a host could open nothing.
synch_host_needs_venue = 'У {{.name}} не выбрана площадка. На синхроне ведущий всегда ведёт площадку, поэтому выберите её или сделайте {{.name}} админом.'

[invite]
# Host invite links (ADR-0030, storage/festaccess/gameinvites.go): what a
# link is called on its join page, and why one does not work.
scope_name = '«{{.game}}» на фесте «{{.fest}}»'
venue_scope_name = 'площадку «{{.venue}}» на фесте «{{.fest}}»'
jury_scope_name = 'жюри феста «{{.fest}}»'
revoked = "Ссылку отозвали. Попросите у организаторов новую."
expired = "Срок действия ссылки истёк. Попросите у организаторов новую."
exhausted = "По этой ссылке уже вошло столько людей, сколько было можно. Попросите у организаторов новую."
spent = "Вы уже входили по этой ссылке, а потом вас убрали из доступа. Попросите у организаторов новую ссылку."
broken = "Ссылка не работает."
not_found = "Такой ссылки нет. Возможно, её удалили вместе с игрой."
label_too_long = "Название ссылки слишком длинное."
limits_out_of_range = "Число входов и срок не могут быть меньше нуля, а срок не может быть больше года."
# A link to a Game of a synch fest, whose hosts each lead a venue.
synch_game = "На синхроне ведущего приглашают на площадку, а не в игру."
# A link named by id that belongs to another fest, or a game outside this fest.
other_fest = "В этом фесте нет такой ссылки."
