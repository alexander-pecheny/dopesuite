# xy — the Telegram nudges (xy/internal/server/notify.go): the best-effort
# knocks sent when a comment mentions someone (or replies to them) and when
# someone asks to join a board through an approval link. Each nudge composes a
# who/verb/where sentence with a board link appended.

[mention]
# Verb fragment when the recipient is @-mentioned in the new comment.
verb_mentioned = "упомянул(а) вас"
# Verb fragment when the recipient is the parent comment's author instead.
verb_replied = "ответил(а) на ваш комментарий"
# Where fragment when the board has no name.
board_unnamed = "на доске"
# Where fragment when the board has a name.
board_named = 'на доске «{{.board}}»'

[join]
# Where fragment when the board has no name.
board_unnamed = "в доску"
# Where fragment when the board has a name (boardDisplayName).
board_named = 'в доску «{{.board}}»'
# The owner's nudge sentence: who is asking, through where, with the board link.
text = '{{.requester}} просится {{.where}} по ссылке-приглашению: {{.link}}'

[passphrase]
# The owner's copy of a board passphrase, sent when the passphrase is set
# (create, import, change) or first typed at the Passphrase Check
# (passphrasetg.go). Sent with parse_mode=HTML: the server escapes both values,
# and <code> makes the passphrase copy on tap.
text = 'Пароль доски «{{.board}}»: <code>{{.passphrase}}</code>'
# The paragraph under it.
keep = 'Это ваша копия пароля. Без пароля доску можно открыть только на устройстве, где она уже открыта. Если пароль поменяют, придёт новое сообщение.'
