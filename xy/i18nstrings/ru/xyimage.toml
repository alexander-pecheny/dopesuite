# xy — the Edited Image prototype at /lab/xyimage (xyimagelab.dopeui +
# xyimagelab.ts, ADR-0024): an infinite canvas in the manner of Figma with one
# Кадр on it. Whatever lies inside the Кадр is baked: a vector PDF through
# typst, a PNG in the browser. Nothing is saved; the page exists to try the
# editor and the browser's own text layout against typst.

[page]
# Browser tab title.
title = "Редактор картинок · xy"
# Topbar heading and the current-page crumb.
name = "Редактор картинок"

[tools]
# The toolbar. Each tooltip names the key that picks the tool.
move = "Выделение и перемещение (V)"
text = "Текст (T)"
rect = "Чёрный прямоугольник (R)"
picture = "Картинка. Её можно и вставить из буфера, и перетащить на холст"
# Runs the card editor's typography pass over every text box: quotes,
# dashes, stress marks, non-breaking spaces and hyphens.
typo = "Типографить"
# Toggles the grid drawn over the Кадр, and snapping to it while dragging.
grid = "Сетка"
snap = "Привязка к сетке"
# Zooms so the Кадр fills the view (Shift+1).
fit = "Показать кадр целиком (Shift+1)"
# Lays the browser's bake over the editor with a difference blend.
compare = "Сравнить с зафиксированными строками: всё, что совпадает с экраном, станет чёрным"
pdf = "PDF"
png = "PNG"
# On the board: write the picture back to the card, and leave the editor.
save = "Сохранить"
close = "Закрыть"

[layers]
# The left panel.
title = "Слои"
frame = "Кадр"
text = "Текст"
rect = "Прямоугольник"
picture = "Картинка"
# Moving the selected layer up or down the stack.
up = "Выше"
down = "Ниже"
remove = "Удалить"
# The navigation help at the foot of the left panel.
help = "Колесо: прокрутка. Ctrl или щипок: масштаб. Пробел и перетаскивание: сдвиг. Двойной щелчок по тексту: правка. Shift или Cmd со щелчком: выделить несколько. Alt и перетаскивание: копия. Запекается только то, что внутри кадра."

[props]
# The right panel's heading when nothing but the Кадр is selected.
frame = "Кадр"
x = "X, мм"
y = "Y, мм"
w = "Ширина, мм"
h = "Высота, мм"
background = "Фон"
dpi = "dpi для PNG"
# The spacing of the editor's grid. It is the editor's setting, not the
# picture's, and is remembered on this device.
grid_step = "Шаг сетки, мм"
size = "Кегль, пт"
leading = "Интерлиньяж"
tracking = "Трекинг, пт"
align = "Выравнивание"
align_left = "Слева"
align_center = "По центру"
align_right = "Справа"
align_justify = "По ширине"
valign = "По вертикали"
valign_top = "Сверху"
valign_middle = "По центру"
valign_bottom = "Снизу"
# The font of a text box: its Family (Noto Sans, or one uploaded to the
# board, ADR-0025) and its Face within it.
font = "Шрифт"
face = "Начертание"
# The button beside the font picker: upload a Family (font files or a zip).
font_upload = "Загрузить шрифт: файлы TTF или OTF, или zip с ними"
# A box set in a Family the board no longer has; the parameter is its name.
font_missing = '{{.name}} (нет на доске)'
# The bundled Noto Sans's four Faces.
regular = "Обычный"
bold = "Жирный"
italic = "Курсив"
bold_italic = "Жирный курсив"
hyphens = "Переносы"
# The text a new box starts with, selected so that typing replaces it.
sample = "Текст"

[arrange]
# Lining boxes up, as in Figma: several selected boxes by their common bounds,
# one box by the Кадр.
left = "Выровнять по левому краю"
hcenter = "Выровнять по центру по горизонтали"
right = "Выровнять по правому краю"
top = "Выровнять по верхнему краю"
vmiddle = "Выровнять по центру по вертикали"
bottom = "Выровнять по нижнему краю"
# Equal gaps between three or more boxes; the outermost two stay.
distribute_x = "Распределить по горизонтали"
distribute_y = "Распределить по вертикали"
# The right panel's heading when several boxes are selected.
picked = 'Выделено: {{.n}}'

[status]
# Shown while typst renders.
working = "typst верстает…"
# Shown while the picture is being baked and uploaded, and once it is.
saving = "Сохранение…"
saved = "Сохранено"
# While an uploaded font is read and stored.
font_uploading = "Загружаю шрифт…"
# Saving refused: a box is set in a font that could not be loaded.
font_missing = 'Шрифта «{{.name}}» нет на доске: выберите для этого текста другой шрифт или загрузите этот заново'
# Shown when an export is ready; the parameter is the number of frozen lines.
frozen_lines = 'Строк зафиксировано: {{.n}}'

[fonts]
# Why an uploaded font file was refused; the parameter is the file's name.
# typst, which sets the PDF, reads neither WOFF nor WOFF2.
woff = '{{.file}}: это веб-шрифт WOFF, а нужен TTF или OTF'
# typst sets only a variable font's default instance.
variable = '{{.file}}: вариативные шрифты пока не поддерживаются, загрузите отдельные начертания в TTF или OTF'
collection = '{{.file}}: коллекции шрифтов (TTC) не поддерживаются, загрузите отдельные файлы TTF или OTF'
notfont = '{{.file}}: это не файл шрифта TTF или OTF'
empty = '{{.file}}: в нём нет ни одного файла TTF или OTF'
toobig = '{{.file}}: начертание больше 20 МБ'
