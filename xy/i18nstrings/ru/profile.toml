# The /profile page (profile.dopeui): account info, the settings shown on the
# page with their values, and the two dialogs (password, board sizes) that
# the ghost buttons under them open.

# Browser-tab title of /profile (page title attribute).
title = "Профиль · xy"
# Topbar heading and the current-page crumb.
name = "Профиль"
# The "all boards" home crumb back to /.
home = "Все доски"
# Submit button of the one-time username form.
save = "Сохранить"
# Cancel button of the change-password dialog.
cancel = "Отмена"
# The message line under a setting once its change is saved.
saved = "Сохранено."

[whoami]
# "Вы вошли как <strong>login</strong>." under the topbar — split around the
# bold login the page fills in.
hint_lead = "Вы вошли как "
hint_mid = "."

[storage]
# "Хранилище: <strong>used</strong>." under the whoami line — split around the
# used-space figure the page fills in.
hint_lead = "Хранилище: "
hint_mid = "."
# The figure itself: megabytes used, out of a quota or against none, and the
# dash shown while it will not load.
used = '{{.mb}} МБ'
of_quota = '{{.used}} из {{.quota}}'
unlimited = '{{.used}} (без лимита)'
unknown = "—"

[username]
# The one-time "set your login" section, hidden once a login exists.
hint = "Задайте логин (один раз)."
# Placeholder of the login field.
placeholder = "Логин"

[account]
# The two actions that are not dialogs: the token-page link and logout.
tokens = "API-токены"
logout = "Выйти"

[password]
# Change-password dialog (passwordOverlay); the opener button reuses name.
name = "Изменить пароль"
# Placeholder of the current-password field.
current = "Текущий пароль (если установлен)"
# Placeholder of the new-password field.
new = "Новый пароль"
# Placeholder of the repeat field.
repeat = "Повторите пароль"
# Submit button of the dialog.
submit = "Сохранить пароль"
# The two answers the form gives: the repeat did not match, and it saved.
mismatch = "Пароли не совпадают."
saved = "Пароль сохранён."

[sizes]
# Board-sizes dialog (sizesOverlay): workspace width, list width, card text
# height and card font; the opener button reuses name.
name = "Настройка ширины / высоты"
# Label of the workspace-width slider.
board_w = "Ширина рабочей области"
# Hint under that slider.
board_w_hint = "Доска центрируется на экране и не становится шире этого значения."
# Checkbox under that slider: whether a board whose lists do not fit the width
# takes the whole screen instead.
board_grow = "Если списки не помещаются, занимать весь экран"
# Label of the list-width slider.
list_w = "Ширина списка"
# Label of the card-text-height slider.
card_h = "Текст карточки"
# Hint under that slider.
card_h_hint = "Сколько строк вопроса показывать на карточке. На максимуме — весь текст."
# Label of the card-font slider.
font = "Шрифт карточки"
# Hint under that slider.
font_hint = "Размер шрифта текста на карточке — мельче шрифт, больше вопросов на экране."
# Ghost button restoring the defaults.
reset = "Сбросить по умолчанию"
# Button closing the dialog.
close = "Готово"
# The value beside each slider: pixels, and what the two maxima mean.
px = '{{.n}} px'
board_w_max = "вся ширина"
card_h_max = "весь текст"
card_lines = '{{.n}} {{plural .n "строка" "строки" "строк"}}'

[font]
# Interface font: which face the whole site is set in. Named for the interface
# because [sizes].font is the card's font SIZE. Label of the select.
name = "Шрифт интерфейса"
# Option: the default face.
noto = "Noto Sans (по умолчанию)"
# Options: the five alternatives, sans first, then serif.
inter = "Inter Fix RA"
plex_sans = "IBM Plex Sans Fix"
literata = "Literata Fix"
plex_serif = "IBM Plex Serif Fix"
stix = "STIX Two Text Fix"

[author]
# Default author: label of the field.
name = "Автор по умолчанию"
# Placeholder of the author-name field.
placeholder = "Имя автора"

[firstrun]
# First-run onboarding dialog (firstrun.ts): the two questions every account
# answers once, on whichever page it opens first.
# Author name placeholder.
author_placeholder = "Иванов Иван"
# aria-label of the dialog, its heading, and the line under it.
label = "Настройки"
title = "Пара настроек"
subtitle = "Их можно поменять потом в профиле."
# The timezone field: its label and the hint under it.
tz_label = "Часовой пояс"
tz_hint = "В нём записывается время тестов. Подставлен пояс этого устройства."
# The default-author field: its label and the hint under it.
author_label = "Автор по умолчанию"
author_hint = "Подставляется в поле «Автор» новых вопросов."
# The two buttons. The later one still stamps onboarded_at.
save = "Сохранить"
later = "Потом"

[tz]
# Timezone, invite cities and test-label naming. Label of the timezone field.
tz_label = "Часовой пояс"
# Label above the cities field.
cities_label = "Города для приглашения"
# Placeholder of the cities field.
cities_placeholder = "Москва, Берлин, Алматы"
# Label of the session-title-mode select.
title_mode_label = "Названия меток тестов"
# Option: session titles carry date and title.
mode_date_title = "дата и название"
# Option: session titles carry the title only.
mode_title = "только название"
# Option: session titles carry the date only.
mode_date = "только дата"

[feed]
# Which kind of entry an opened card's feed starts on. Label of the select.
name = "Лента"
# Option: every kind of entry.
all = "Всё"
# Option: comments.
comments = "Комментарии"
# Option: edit history.
edits = "Правки"
# Option: labels and attachments.
meta = "Метки и вложения"

[card_title]
# What a board list shows on a card. Label of the select.
name = "Заголовок карточки"
# Option: the question text.
question = "Текст вопроса"
# Option: the answer.
answer = "Ответ"
