# Board invite links (ADR-0017) inside the members dialog (boardinvites.ts):
# the link rows, the join-request queue above them, and the mint form behind
# «+ Создать ссылку».

[state]
# The server's word on why a link works or does not — the row's first fact.
active = "активна"
revoked = "отозвана"
expired = "просрочена"
exhausted = "исчерпана"

[usage]
# How much of a link is spent (inviteUsage): the spent count alone, or the
# same count followed by what is left on a capped link.
used = 'использований: {{.n}}'
left = 'использований: {{.n}}, осталось: {{.left}}'

[time]
# The coarse remainder a deciding editor sees (inviteTimeLeft); "" when the
# link has no expiry.
expired = "срок истёк"
days = 'осталось {{.n}} дн'
hours = 'осталось {{.n}} ч'
under_hour = "осталось меньше часа"

[facts]
# Extra fact pushed onto a link that collects join requests.
approval = "с одобрением"

[request]
# A waiting join request: the owner's two decision buttons.
approve = "Принять"
decline = "Отклонить"

[row]
# One link row (renderInvites): fallback name, who joined, the owner actions.
default_label = "Ссылка"
joined = 'вошли: {{.names}}'
copy = "Копировать"
revoke = "Отозвать"
remove = "Удалить"
# confirm() text before the link and its join history are deleted.
remove_confirm = "Удалить ссылку вместе с историей входов по ней?"

[message]
# Status line after the link was copied to the clipboard.
copied = "Ссылка скопирована."

[form]
# The mint form (buildForm): name, expiry, use cap, approval checkbox.
label_placeholder = "Название, например «тестерам»"
submit = "Создать"
ttl_label = "Срок"
# Expiry chips: one hour, one day, one week, no expiry.
ttl_hour = "час"
ttl_day = "сутки"
ttl_week = "неделя"
ttl_never = "без срока"
# Label of the use-cap chip row.
uses_label = "Использований"
# The uncapped chip of that row.
uses_unlimited = "без ограничения"
# Approval checkbox caption.
approval = "С одобрением владельца"

[page]
# Invite landing page (join.ts).
# Board name wrapper: names the board inside quotes.
board_wrapper = '«{{.name}}»'
# Board name fallback when board name is empty.
board_fallback = "доску"
# Topbar heading and the current-page crumb of /join/<code>.
title = "Приглашение"
# One heading and one line per state of the link: what it offers, or why it
# does not work. The board name is the wrapper above.
active_approval_heading = 'Заявка в {{.board}}'
active_approval_note = "Владелец доски рассмотрит заявку — доступ появится после одобрения."
active_heading = 'Приглашение в {{.board}}'
active_note = "Пароль доски придётся узнать у того, кто вас позвал: по ссылке он не передаётся."
member_heading = 'Вы уже в {{.board}}'
pending_heading = "Заявка отправлена"
pending_note = "Ждём, пока владелец доски её рассмотрит."
declined_heading = "Заявка отклонена"
declined_note = "По этой ссылке войти больше нельзя — попросите новую."
revoked_heading = "Ссылка отозвана"
ask_new = "Попросите у владельца доски новую."
expired_heading = "Срок ссылки истёк"
exhausted_heading = "Ссылка исчерпана"
exhausted_note = "По ней уже прошли все, кого она пускала."
spent_heading = "По этой ссылке вы уже проходили"
broken_heading = "Ссылка не работает"
# Shown when the code names no invite at all.
not_found = "Ссылка не найдена"
# The one button, in its three forms.
open_board = "Открыть доску"
request = "Подать заявку"
join = "Присоединиться"
