# Label above the raw-text editor.
desc_label = "Описание"
# Danger button deleting the card.
delete = "Удалить карточку"
# Label section: add button and the new-label form.
label_add = "Добавить метку…"
new_label_placeholder = "Новая метка"
new_label_title = "Создать и добавить метку"
# Alias section.
alias_label = "Алиас"
alias_placeholder = "короткое имя карточки — показывается в списке вместо текста"
# Excerpts row: the view button (the count is a runtime mount).
excerpts_view = "Смотреть"
# Attachments section.
attachments_label = "Вложения"
# The WebP compression checkbox (also the paste-image dialog's).
compress = " сжать (WebP)"
# Upload button.
upload = "Загрузить"
# Move/copy section: heading.
move_label = "Переместить / копировать"
# Handout badge on a kanban card: tooltip.
handout_title = "Раздаточный материал"
# Versions badge on a kanban card: tooltip.
