# xy — the board surface: the ЧГК board screen (board.dopeui) plus the
# board-level TypeScript that fills it in — board.ts (board, lists, cards,
# feed wiring), masspanel.ts (mass actions) and boardmembers.ts (the roster).
# Tables follow the order a reader meets the strings; the shared chrome
# vocabulary ([fields], [actions], [error]) sits at the end.

[page]
# Browser tab title of a board page.
title = "Доска · xy"
# Topbar heading and the current-page crumb before the board's real name
# arrives (the crumb is then replaced by the board name).
name = "Доска"
# The "all boards" crumb back to /.
home = "Все доски"
# Crumb text when the board cannot be shown without the network (board.ts).
offline = "Доска недоступна офлайн"
# Tooltip of the sync-status dot in that state.
offline_hint = "Нет сохранённой копии — откройте доску при подключении"

[bell]
# Label of the topbar events button.
label = "События"
# Its tooltip.
title = "События других участников"

[timer]
# Label of the topbar timer button.
label = "Таймер"
# Its tooltip, and the aria-label of the timer box itself.
title = "Таймер ЧГК"
# The four presets in the mode picker, and that picker's aria-label.
mode_label = "Режим таймера"
preset_regular = "Обычный вопрос (60 с)"
preset_duplet = "Дуплет (30 + 30)"
preset_blitz = "Блиц (20 + 20 + 20)"
preset_custom = "Свой…"
# The custom-durations field, shown only under that preset.
custom_placeholder = "напр. 40+20"
custom_label = "Свои длительности, через +"
# What the display says under the clock: the answer window, the end, and
# which segment of a multi-part question is running.
phase_answer = "Ответ"
phase_done = "Готово"
phase_segment = 'Вопрос {{.n}} / {{.total}}'
# The three buttons. Icons, not captions — three worded buttons overflowed the
# 240px box, so the word lives in title/aria-label. Start says "continue"
# after a pause.
start = "Старт"
resume = "Продолжить"
pause = "Пауза"
reset = "Сброс"

[unlock]
# Title and aria-label of the unlock dialog and of the passphrase-check
# dialog — both are introduced as just "the board's password".
title = "Пароль доски"
# Placeholder of the passphrase field on both dialogs.
pass_placeholder = "Пароль доски"
# Submit button of the unlock form.
submit = "Открыть"
# Ghost button offering the way out when the passphrase is lost.
forgot = "Не помню пароль"
# Danger hint of the exit block: the content is gone without the password.
exit_hint = "Содержимое доски без пароля не восстановить."

[passcheck]
# Title of the monthly passphrase-check dialog.
title = "Помните пароль доски?"
# Two-node hint naming the check's purpose (the kit joins the nodes with a
# space; the split keeps each node byte-identical).
hint_lead = "Раз в месяц xy спрашивает пароль доски: на этом устройстве она открывается"
hint_mid = "без него, и забытый пароль обнаружится только тогда, когда будет поздно."
# Submit button of the check form.
submit = "ОК"
# Ghost button handing over to the passphrase change.
forgot = "Не помню пароль, поменять"
# Hint of step 2, after the passphrase checked out.
saved_hint = "Пароль сохранён. А ещё сейчас хорошее время, чтобы сохранить бэкап."
# Primary button starting the backup flow.
backup = "Сохранить бэкап"

[changepass]
# Title of the change-passphrase dialog.
title = "Сменить пароль доски"
# Placeholder of the new-passphrase field.
placeholder = "Новый пароль доски"
# Label of the dice icon button that generates a passphrase.
generate = "Сгенерировать пароль"
# Muted line shown once the generated passphrase has been copied.
copied = "Пароль уже скопирован"
# Danger hint under the field.
danger = "Сохраните этот пароль прямо сейчас — восстановить его будет невозможно."
# Checkbox where the reader confirms the passphrase is stored safely.
saved = "Я сохранил(а) пароль в надёжное место и обещаю его не терять"
# Submit button (disabled until the checkbox is ticked).
submit = "Сменить"

