# The telegram export of a board (internal/server/exporttg.go): the lines the
# export endpoint streams to the modal that watches it. The target resolution
# and the access checks belong to chgksuite's tg.toml.

[export]
# The export endpoint's own lines, streamed to the modal that watches it.
# Nothing to post to.
missing_fields = "Нужны токен бота и канал."
# The first line, before the bot has said anything.
connecting = "Подключаемся к боту…"
# Resolution is over and the questions start going out.
posting = 'Публикуем в {{.channel}}, обсуждение {{.chat}}…'
# A failure that was not written for the reader.
failed = "Не удалось опубликовать в телеграм."
