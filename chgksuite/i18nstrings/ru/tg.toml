# The telegram publisher's target resolution (tg/resolve.go): the errors of
# finding the channel and checking the bot's access. xy's tg.toml holds the
# board export that drives it.

[verify]
# getChat found no public channel with that username.
not_found = 'канал @{{.name}} не найден: у закрытого канала нет имени, укажите его id или ссылку на любой его пост'
# getChat found no discussion group linked to the channel.
no_discussion = "у канала нет группы обсуждения: привяжите её в настройках канала"
# verifyAccess, when the bot is not in the chat at all.
not_member = 'бот не добавлен к {{.what}}: {{.err}}'
# verifyAccess, when the bot is in the chat but lacks administrator rights.
not_admin = 'бот не администратор {{.what}}'
# The what fragment for the channel, dative («не добавлен к …»).
what_channel = "каналу"
# The what fragment for the discussion group, dative.
what_chat = "группе обсуждения"
# The same two in the genitive («не администратор …»).
of_channel = "канала"
of_chat = "группы обсуждения"
